    function applyJokeEffect(isActive, type = 'evasive') {
        const tags = ['button', '.btn', '.icon-button', '.nav-item', '.action-btn', '.batch-card'];
        const targets = document.querySelectorAll(tags.join(', '));
        const body = document.body;

        // Reset all effects first
        targets.forEach(el => {
            if (el._jokeListener) {
                el.removeEventListener('mouseover', el._jokeListener);
                el._jokeListener = null;
            }
            el.style.transform = '';
            el.style.transition = '';
            el.style.animationDelay = '';
            el.classList.remove('joke-shake-active');
            el.classList.remove('joke-floating-active');
        });
        body.classList.remove('joke-flip-active');
        body.classList.remove('joke-giant-cursor');
        body.classList.remove('joke-lag-active');

        const bsod = document.getElementById('joke-bsod');
        if (bsod) bsod.classList.remove('active');

        const fakeCursor = document.getElementById('fake-cursor');
        if (fakeCursor) fakeCursor.classList.remove('active');

        const jumpscare = document.getElementById('joke-jumpscare');
        if (jumpscare) jumpscare.classList.remove('active');
        const audioEl = document.getElementById('joke-jumpscare-audio');
        if (audioEl) {
            audioEl.pause();
            audioEl.currentTime = 0;
        }

        // Cleanup Virus Pop-up
        const virusPopups = document.querySelectorAll('.joke-virus-popup');
        virusPopups.forEach(p => p.remove());

        // Remove listeners
        if (window._jokeGhostListener) {
            document.removeEventListener('input', window._jokeGhostListener, true);
            window._jokeGhostListener = null;
        }
        if (window._jokeLagListener) {
            document.removeEventListener('mousemove', window._jokeLagListener);
            window._jokeLagListener = null;
        }

        // [CLEANUP] Stop glitch interval
        if (window._jokeGlitchInterval) {
            clearInterval(window._jokeGlitchInterval);
            window._jokeGlitchInterval = null;
            // Restore original text if possible
            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
                acceptNode: function (node) {
                    const parent = node.parentElement;
                    if (!parent) return NodeFilter.FILTER_REJECT;
                    const tag = parent.tagName.toLowerCase();
                    if (tag === 'script' || tag === 'style' || tag === 'svg' || tag === 'path' || parent.closest('#modal-developer')) {
                        return NodeFilter.FILTER_REJECT;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            });
            let node;
            while (node = walker.nextNode()) {
                if (node._original) {
                    node.nodeValue = node._original;
                    delete node._original;
                }
            }
        }

        if (!isActive) return;

        // Apply specific effect
        if (type === 'evasive') {
            targets.forEach(el => {
                el.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
                el._jokeListener = function () {
                    const range = 180;
                    const x = (Math.random() - 0.5) * range * 2;
                    const y = (Math.random() - 0.5) * range * 2;
                    el.style.transform = `translate(${x}px, ${y}px)`;
                    setTimeout(() => { if (Math.random() > 0.6) el.style.transform = ''; }, 3000);
                };
                el.addEventListener('mouseover', el._jokeListener);
            });
        }
        else if (type === 'shake') {
            targets.forEach(el => {
                el.classList.add('joke-shake-active');
            });
        }
        else if (type === 'flip') {
            body.classList.add('joke-flip-active');
        }
        else if (type === 'ghost') {
            window._jokeGhostListener = function (e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    if (Math.random() > 0.95) { // 5% chance to purely delete
                        const val = e.target.value;
                        e.target.value = val.substring(0, Math.max(0, val.length - 1));
                    } else if (Math.random() > 0.20) { // 80% chance to insert typo (random letter)
                        const chars = "abcdefghijklmnopqrstuvwxyz";
                        e.target.value += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                }
            };
            document.addEventListener('input', window._jokeGhostListener, true);
        }
        else if (type === 'bsod') {
            let bsodEl = document.getElementById('joke-bsod');
            if (!bsodEl) {
                const html = `
                    <div id="joke-bsod" class="joke-bsod-overlay">
                        <div class="joke-bsod-smile">:(</div>
                        <div class="joke-bsod-text">
                            Your device ran into a problem and needs to restart. We're just collecting some error info, and then we'll restart for you.<br><br>
                            100% complete
                        </div>
                        <div class="joke-bsod-qr">
                            <div class="joke-bsod-qr-code"></div>
                            <div style="font-size: 14px;">
                                For more information about this issue and possible fixes, visit https://www.windows.com/stopcode<br><br>
                                If you call a support person, give them this info:<br>
                                Stop code: CRITICAL_PROCESS_DIED (DASHBOARD_FAILED)
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', html);
                bsodEl = document.getElementById('joke-bsod');
            }
            bsodEl.classList.add('active');
        }
        else if (type === 'cursor') {
            body.classList.add('joke-giant-cursor');
        }
        else if (type === 'floating') {
            targets.forEach((el, i) => {
                el.classList.add('joke-floating-active');
                el.style.animationDelay = (i * 0.2) + 's';
            });
        }
        else if (type === 'lag') {
            body.classList.add('joke-lag-active');
            let fCursor = document.getElementById('fake-cursor');
            if (!fCursor) {
                const svg = `<svg viewBox="0 0 24 24" width="24" height="24" fill="white" stroke="black" stroke-width="1"><path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.83-4.83 2.3 5.43c.12.28.39.45.67.45.1 0 .2-.02.3-.06.38-.16.56-.61.4-.99l-2.32-5.47 6.7.01c.31 0 .47-.37.25-.59L6.35 2.86c-.22-.22-.59-.06-.59.25z"/></svg>`;
                document.body.insertAdjacentHTML('beforeend', `<div id="fake-cursor">${svg}</div>`);
                fCursor = document.getElementById('fake-cursor');
            }
            fCursor.classList.add('active');

            window._jokeLagListener = function (e) {
                // Delay 600ms
                setTimeout(() => {
                    if (fCursor) {
                        fCursor.style.left = e.clientX + 'px';
                        fCursor.style.top = e.clientY + 'px';
                    }
                }, 600);
            };
            document.addEventListener('mousemove', window._jokeLagListener);
        } else if (type === 'glitch') {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()_+{}[]|;:,.<>?';

            function scrambleText(text) {
                if (!text) return text;
                return text.split('').map(c => {
                    if (c === ' ' || c === '\n') return c;
                    return Math.random() > 0.7 ? chars[Math.floor(Math.random() * chars.length)] : c;
                }).join('');
            }

            window._jokeGlitchInterval = setInterval(() => {
                // Find all text elements but ignore scripts, styles, and SVG paths
                const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
                    acceptNode: function (node) {
                        const parent = node.parentElement;
                        if (!parent) return NodeFilter.FILTER_REJECT;
                        const tag = parent.tagName.toLowerCase();
                        if (tag === 'script' || tag === 'style' || tag === 'svg' || tag === 'path' || parent.closest('#modal-developer')) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        return NodeFilter.FILTER_ACCEPT;
                    }
                });

                let node;
                while (node = walker.nextNode()) {
                    if (!node._original) node._original = node.nodeValue;
                    node.nodeValue = scrambleText(node._original);
                }
            }, 1000);
        } else if (type === 'jumpscare') {
            let jumpscareEl = document.getElementById('joke-jumpscare');
            if (!jumpscareEl) {
                const html = `
                    <div id="joke-jumpscare" class="joke-jumpscare-overlay">
                        <!-- Ganti URL_AUDIO_DISINI dengan link audio jumpscare -->
                        <audio id="joke-jumpscare-audio" src="URL_AUDIO_DISINI" preload="auto"></audio>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', html);
                jumpscareEl = document.getElementById('joke-jumpscare');
            }
            jumpscareEl.classList.add('active');
            const audioEl = document.getElementById('joke-jumpscare-audio');
            if (audioEl) {
                audioEl.currentTime = 0;
                audioEl.play().catch(e => console.log('Audio autoplay blocked', e));
            }
        } else if (type === 'virus') {
            spawnVirusPopup();
        }
    }

    function spawnVirusPopup() {
        const popup = document.createElement('div');
        popup.className = 'joke-virus-popup';

        // Random position
        const x = Math.max(10, Math.floor(Math.random() * (window.innerWidth - 300)));
        const y = Math.max(10, Math.floor(Math.random() * (window.innerHeight - 150)));

        popup.style.left = x + 'px';
        popup.style.top = y + 'px';

        popup.innerHTML = `

                <span>⚠️ System Error</span>

        const popup = btn.closest('.joke-virus-popup');

    function initAnnouncementCheck() {
        if (!currentUser) return;
        console.log('Checking for global updates (Announcement, Joke, Reload)...');
        google.script.run.withSuccessHandler(data => {
            console.log('Update Data Received:', data);
            if (!data) return;

            // 0. Handle Maintenance (Check for everyone)
            if (data.maintenance) {
                applyMaintenanceUI(data.maintenance);
                if (data.maintenance.active && currentUser && currentUser.role !== 'Developer') {
                    return; // Stop processing other updates if system is locked
                }
            }

            // 1. Handle Force Reload (Check this first to take immediate effect)
            if (data.forceReload) {
                console.warn('⚠️ Instruction: FORCE RELOAD RECEIVED FROM DEVELOPER');
                showToast('warning', 'System Update', 'Developer sedang memperbarui sistem. Me-reload halaman...');
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
                return; // Stop other checks if reloading
            }


            // 3. Handle Joke
            const isTarget = data.joke_target && currentUser && data.joke_target === currentUser.email;
            applyJokeEffect(isTarget, data.joke_type);

        }).withFailureHandler(err => {
            console.error('Update check failed:', err);
        }).getGlobalAnnouncement(currentUser.email);
    }

    /**
     * Chart Laporan
     */
    function renderLaporanChart(res, filterKategori) {
        const ctx = document.getElementById('chart-laporan-rekap');
        if (!ctx) return;

        const tawaranArr = [];
        const diterimaArr = [];

        for (let m = 0; m < 12; m++) {
            let sm = 0, sacc = 0;
            res.kategori.forEach(k => {
                if (filterKategori === 'all' || filterKategori === k) {
                    sm += res.data[k][m].tawaran;
                    sacc += res.data[k][m].diterima;
                }
            });
            tawaranArr.push(sm);
            diterimaArr.push(sacc);
        }

        if (_laporanChartInstance) {
            _laporanChartInstance.destroy();
            _laporanChartInstance = null;
        }

        _laporanChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: res.bulan,
                datasets: [
                    { label: 'SM (Tawaran)', data: tawaranArr, backgroundColor: 'rgba(79,172,254,0.7)', borderColor: '#4facfe', borderWidth: 2, borderRadius: 6 },
                    { label: 'SACC (Diterima)', data: diterimaArr, backgroundColor: 'rgba(67,233,123,0.7)', borderColor: '#43e97b', borderWidth: 2, borderRadius: 6 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            afterLabel: function (ctx) {
                                const idx = ctx.dataIndex;
                                const sm = tawaranArr[idx], sacc = diterimaArr[idx];
                                if (ctx.datasetIndex === 1 && sm > 0) return 'Rate: ' + Math.round((sacc / sm) * 100) + '%';
                                return '';
                            }
                        }
                    }
                },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });
    }

    function switchLaporanChart(filterKategori) {
        if (!_laporanRawData) return;
        renderLaporanChart(_laporanRawData, filterKategori);

    function exportLaporanCSV() {
        if (!_laporanRawData) return;
        const res = _laporanRawData;
        let csvRows = [];
        let h1 = ['PERIHAL'];
        res.bulan.forEach(b => { h1.push(b + ' SM'); h1.push(b + ' SACC'); });
        h1.push('TOTAL SM'); h1.push('TOTAL SACC'); h1.push('RATE');
        csvRows.push(h1.join(','));

        res.kategori.forEach(k => {
            let row = [k]; let totSM = 0, totSACC = 0;
            for (let m = 0; m < 12; m++) {
                row.push(res.data[k][m].tawaran); row.push(res.data[k][m].diterima);
                totSM += res.data[k][m].tawaran; totSACC += res.data[k][m].diterima;
            }
            const rate = totSM > 0 ? Math.round((totSACC / totSM) * 100) : 0;
            row.push(totSM); row.push(totSACC); row.push(rate + '%');
            csvRows.push(row.join(','));
        });

        let gtRow = ['JUMLAH'];
        for (let m = 0; m < 12; m++) {
            let sm = 0, sacc = 0;
            res.kategori.forEach(k => { sm += res.data[k][m].tawaran; sacc += res.data[k][m].diterima; });
            gtRow.push(sm); gtRow.push(sacc);
        }
        const gt = res.grandTotal;
        gtRow.push(gt.totalTawaran); gtRow.push(gt.totalDiterima); gtRow.push(gt.rate + '%');
        csvRows.push(gtRow.join(','));

        const csvContent = '\uFEFF' + csvRows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'Rekap_Magang_' + (res.year || 'all') + '.csv';
        a.click(); URL.revokeObjectURL(url);
        if (typeof showToast === 'function') showToast('success', 'Export Berhasil', 'File CSV berhasil diunduh.');
    }

    // Auto-trigger
    (function () {
        function hookLaporanPage() {
            const laporanPage = document.getElementById('page-laporan');
            if (!laporanPage) return;
            const observer = new MutationObserver(function (mutations) {
                mutations.forEach(function (mutation) {
                    if (mutation.attributeName === 'class') {
                        const isActive = laporanPage.classList.contains('active');
                        if (isActive && typeof loadLaporanRekap === 'function') {
                            if (!window._laporanLoaded) { window._laporanLoaded = true; loadLaporanRekap(); }
                        }
                        if (!isActive) window._laporanLoaded = false;
                    }
                });
            });
            observer.observe(laporanPage, { attributes: true });
            document.addEventListener('click', function (e) {
                const navItem = e.target.closest('[data-page="laporan"]');
                if (navItem && typeof loadLaporanRekap === 'function') { setTimeout(function () { loadLaporanRekap(); }, 100); }
            });
        }
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', hookLaporanPage); } else { hookLaporanPage(); }
    })();

    /**
     * Sidebar Navigation
     */
    function loadLaporanYears() {
        google.script.run.withSuccessHandler(function (response) {
            if (response.success && response.years) { renderLaporanSidebar(response.years); }
        }).getMagangYears();
    }

    function renderLaporanSidebar(years) {
        const submenu = document.getElementById('submenu-laporan');
        if (!submenu) return;
        if (years.length === 0) { submenu.innerHTML = '<li class="submenu-item disabled">Tidak ada data</li>'; return; }
        submenu.innerHTML = years.map(year => `
        <li class="submenu-item" onclick="navigateToYear(${year})">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #667eea; opacity: 0.5;"></span>
            Tahun ${year}
        </li>
    `).join('');
    }

    function navigateToYear(year) {
        navigateToPage('laporan');
        const yearInput = document.getElementById('laporan-year-filter');
        if (yearInput) {
            yearInput.value = year;
            setTimeout(() => { loadLaporanRekap(); }, 100);
        }
    }

</script>
