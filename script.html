    function toggleBatchMenu(batchName, event) {
        document.querySelectorAll('.batch-dropdown').forEach(el => {
            if (el.id !== `menu-${batchName}`) el.style.display = 'none';
        });
        const menu = document.getElementById(`menu-${batchName}`);
        if (menu) menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';

        if (!window.hasMenuListener) {
            window.addEventListener('click', () => {
                document.querySelectorAll('.batch-dropdown').forEach(el => el.style.display = 'none');
            });
            window.hasMenuListener = true;
        }
    }

            showToast('error', 'Error', 'Nama batch tidak boleh kosong');

        if (newName === oldName) {
            closeModal();
            return;
        }

        closeModal();
        showToast('info', 'Memproses...', 'Sedang mengubah nama batch');

        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    showToast('success', 'Berhasil', 'Batch berhasil diubah namanya');

                    showToast('error', 'Gagal', res.message);

            .withFailureHandler(function (err) {
                showToast('error', 'Error', err.message);
            })
            .renameMagangSheet(oldName, newName);

    // ===== MAGANG DATA =====
    function loadMagangData(sheetName) {
        if (typeof sheetName === 'string') {
            // Check if sheet changed
            if (currentMagangSheet !== sheetName) {
                // Reset cache if changing sheets
                autocompleteCache = {
                    'UNIVERSITAS': null,
                    'JURUSAN': null,
                    'NOMOR SURAT': null
                };
            }
            currentMagangSheet = sheetName;
        }

        const batchView = document.getElementById('magang-batch-view');
        const listView = document.getElementById('magang-list-view');
        const batchTitle = document.getElementById('magang-batch-title');

        if (batchView) batchView.style.display = 'none';
        if (listView) listView.style.display = 'block';
        if (batchTitle) batchTitle.textContent = 'Data Magang - ' + currentMagangSheet;

        const loadingEl = document.getElementById('magang-loading');
        const tableWrapper = document.getElementById('magang-table-wrapper');

        loadingEl.style.display = 'block';
        tableWrapper.style.display = 'none';

        google.script.run
            .withSuccessHandler(function (response) {
                try {
                    if (response.success) {
                        // CLIENT-SIDE MAPPING: Convert Array of Arrays -> Array of Objects
                        // This is much faster than doing it on the server
                        const rawData = response.data; // Array of Arrays
                        const headers = response.headers;

                        magangData = rawData.map((row, index) => {
                            let obj = {};
                            headers.forEach((header, i) => {
                                obj[header] = row[i];
                            });
                            // Add original index for proper targeting after filtering
                            obj._originalIndex = index;
                            return obj;
                        });

                        // INITIALIZE FILTERED DATA GLOBAL
                        window.MAGANG_FILTERED_DATA = magangData;

                        renderMagangTable(magangData, headers);
                        setupMagangSearch(magangData, headers);
                        populateMagangFilters(magangData); // NEW: Populate filters
                        updateMagangStats(magangData, magangData); // NEW: Init Stats
                        loadDashboardData();
                    } else {
                        loadingEl.innerHTML = `<p style="color: #ef4444;">${response.message}</p>`;
                    }
                } catch (e) {
                    console.error("Mapping Error:", e);
                    loadingEl.innerHTML = `<p style="color: #ef4444;">Check Console: ${e.message}</p>`;
                }
            })
            .withFailureHandler(function (error) {
                loadingEl.innerHTML = `<p style="color: #ef4444;">Error: ${error.message}</p>`;
            })
            .getMagangData(currentMagangSheet);
    }

    // Helper: Parse Date Robustly (Handles "14 Januari 2026" etc.)
    function parseDateRobust(dateVal) {
        if (!dateVal) return null;
        if (dateVal instanceof Date) return dateVal;

        // Try standard parse first
        let date = new Date(dateVal);
        if (!isNaN(date.getTime())) return date;

        // Try parsing Indonesian format: "DD Month YYYY"
        if (typeof dateVal === 'string') {
            const monthsIndo = {
                'januari': 'January', 'februari': 'February', 'maret': 'March', 'april': 'April',
                'mei': 'May', 'juni': 'June', 'juli': 'July', 'agustus': 'August',
                'september': 'September', 'oktober': 'October', 'november': 'November', 'desember': 'December'
            };

            let dateStr = dateVal.toLowerCase();
            for (const [indo, eng] of Object.entries(monthsIndo)) {
                if (dateStr.includes(indo)) {
                    dateStr = dateStr.replace(indo, eng);
                    break;
                }
            }

            date = new Date(dateStr);
            if (!isNaN(date.getTime())) return date;
        }

        return null;
    }



    function applyMagangFilters() {
        let baseData = [...magangData];

        // Ensure keys are detected
        let keys = window.MAGANG_KEYS;
        // Fallback detection
        if (!keys && magangData.length > 0) {
            const findKey = (target) => Object.keys(magangData[0]).find(k => k.toUpperCase() === target.toUpperCase()) || target;
            keys = {
                UNIV: findKey('UNIVERSITAS'),
                UNIT: findKey('UNIT KERJA'),
                STATUS: findKey('KET'),
                KEHADIRAN: findKey('KEHADIRAN'),
                REK: findKey('REKOMENDASI')
            };
        }
        if (!keys) keys = { UNIV: 'UNIVERSITAS', UNIT: 'UNIT KERJA', STATUS: 'KET', KEHADIRAN: 'KEHADIRAN', REK: 'REKOMENDASI' };

        // --- 1. BASE FILTERS (Badge, Search, Univ, Unit, Rekomendasi) ---

        // Filter by Status Badge (Active/Finished)
        if (magangStatusFilter !== 'all') {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            baseData = baseData.filter(row => {
                const dateVal = row['TGL SELESAI'];
                // Use dynamic key for status to handle case sensitivity (KET vs Ket vs STATUS)
                const statusKey = keys ? keys.STATUS : 'KET';
                const status = (row[statusKey] || '').toString().trim();

                const endDate = parseDateRobust(dateVal);
                if (!endDate) return false;
                endDate.setHours(0, 0, 0, 0);

                if (magangStatusFilter === 'active') return endDate >= today;
                if (magangStatusFilter === 'finished') {
                    // STRICT FILTER: "Jangan tampilkan selain validation sudah diteruskan"
                    // User explicitly wants to hide 'DITOLAK' and 'Belum Dibuatkan SB'
                    // We also ensure that empty status items don't sneak in if they have old dates, 
                    // unless we assume empty = valid. 
                    // The safest interpretation of "Only show Already Forwarded" is to filter for POSITIVE statuses.

                    if (status === 'DITOLAK' || status === 'Belum Dibuatkan SB') return false;

                    // Extra safety: If status is present but not one of the success states?
                    // Let's stick to the explicit exclusion requested + date check.
                    // But if the user says "Separate from validation already forwarded", maybe they mean:
                    // MUST BE 'Sudah Diteruskan' OR 'Sudah Dibuatkan SB' AND Expired.

                    const isSuccessStatus = status === 'Sudah Diteruskan' || status === 'Sudah Dibuatkan SB';

                    // If status is empty, we might allow it (legacy data), but if status is present and NOT success, block it?
                    // User complaint was specifically about DITOLAK showing up.

                    return endDate < today;
                }
                return true;
            });
        }

        // Filter by Search Query
        if (magangSearchQuery !== '') {
            const queryTerms = magangSearchQuery.toLowerCase().trim().split(/\s+/);
            baseData = baseData.filter(row => {
                return queryTerms.every(term => {
                    return magangHeaders.some(header => {
                        const value = row[header];
                        return value != null && value.toString().toLowerCase().includes(term);
                    });
                });
            });
        }

        const univSelect = document.getElementById('filter-magang-universitas');
        const unitSelect = document.getElementById('filter-magang-unit');
        const rekSelect = document.getElementById('filter-magang-rekomendasi');
        const statusSelect = document.getElementById('filter-magang-status');
        const kehadiranSelect = document.getElementById('filter-magang-kehadiran');
        const jenisSelect = document.getElementById('filter-magang-jenis');

        // --- FILTER JENIS PENGAJUAN (PKL, Magang, Penelitian) ---
        if (jenisSelect && jenisSelect.value) {
            const jenisFilter = jenisSelect.value;
            baseData = baseData.filter(row => {
                const universitas = (row[keys.UNIV] || '').toString().toLowerCase();
                const perihal = (row[keys.PERIHAL] || '').toString().toLowerCase();

                if (jenisFilter === 'PKL') {
                    // Jika ada kata 'smk' -> PKL
                    return universitas.includes('smk');
                } else if (jenisFilter === 'Penelitian') {
                    // Jika ada 'universitas' DAN perihal 'penelitian' -> Penelitian
                    return universitas.includes('universitas') && perihal.includes('penelitian');
                } else if (jenisFilter === 'Magang') {
                    // Jika ada 'universitas' DAN perihal BUKAN 'penelitian' -> Magang
                    return universitas.includes('universitas') && !perihal.includes('penelitian');
                }
                return true;
            });
        }

        if (univSelect && univSelect.value) {
            baseData = baseData.filter(row => row[keys.UNIV] === univSelect.value);
        }
        if (unitSelect && unitSelect.value) {
            baseData = baseData.filter(row => row[keys.UNIT] === unitSelect.value);
        }
        // Backward compatibility for Unit
        const oldUnitSelect = document.getElementById('unit-filter-select');
        if (oldUnitSelect && oldUnitSelect.value && (!unitSelect || !unitSelect.value)) {
            baseData = baseData.filter(row => row[keys.UNIT] === oldUnitSelect.value);
        }
        if (rekSelect && rekSelect.value) {
            baseData = baseData.filter(row => row[keys.REK] === rekSelect.value);
        }

        // Filter by Nomor Surat
        const nsSelect = document.getElementById('filter-magang-nosurat');
        if (nsSelect && nsSelect.value) {
            baseData = baseData.filter(row => row['NOMOR SURAT'] === nsSelect.value);
        }

        // --- 2. CALCULATE COUNTS (Contextual) ---

        // Status Counts: Use baseData + Kehadiran Filter (Ignore Status Filter)
        let statusContextData = [...baseData];
        if (kehadiranSelect && kehadiranSelect.value) {
            statusContextData = statusContextData.filter(row => row[keys.KEHADIRAN] === kehadiranSelect.value);
        }

        // Kehadiran Counts: Use baseData + Status Filter (Ignore Kehadiran Filter)
        let kehadiranContextData = [...baseData];
        if (statusSelect && statusSelect.value) {
            kehadiranContextData = kehadiranContextData.filter(row => row[keys.STATUS] === statusSelect.value);
        }

        updateMagangStats(statusContextData, kehadiranContextData);

        // --- 3. FINAL FILTERING (Apply remaining filters) ---
        let finalData = [...baseData];
        if (statusSelect && statusSelect.value) {
            finalData = finalData.filter(row => row[keys.STATUS] === statusSelect.value);
        }
        if (kehadiranSelect && kehadiranSelect.value) {
            finalData = finalData.filter(row => row[keys.KEHADIRAN] === kehadiranSelect.value);
        }

        // Store for Export usage
        window.MAGANG_FILTERED_DATA = finalData;

        renderMagangTable(finalData, magangHeaders);
    }

        populateSelect('filter-magang-universitas', univs, 'Semua Universitas');

    function updateMagangStats(statusData, kehadiranData) {
        let keys = window.MAGANG_KEYS;

        // Fallback detection (using statusData as reference)
        const refData = statusData || kehadiranData || [];
        if (!keys && refData.length > 0) {
            const findKey = (target) => Object.keys(refData[0] || {}).find(k => k.toUpperCase() === target.toUpperCase()) || target;
            keys = {
                STATUS: findKey('KET'),
                KEHADIRAN: findKey('KEHADIRAN')
            };
        }
        if (!keys) return; // Should not happen if data loaded

        // Count for Status Dropdown (using statusData)
        const statusCounts = {};
        if (statusData) {
            statusData.forEach(row => {
                const status = (row[keys.STATUS] || '').toString().trim();
                // We count all, including empty if we want to show "Unspecified"? 
                // Usually filters hide empty options unless populated. 
                // But populateMagangFilters filters out empty.
                if (status) statusCounts[status] = (statusCounts[status] || 0) + 1;
            });
        }

        // Count for Kehadiran Dropdown (using kehadiranData)
        const kehadiranCounts = {};
        if (kehadiranData) {
            kehadiranData.forEach(row => {
                const kehadiran = (row[keys.KEHADIRAN] || '').toString().trim();
                if (kehadiran) kehadiranCounts[kehadiran] = (kehadiranCounts[kehadiran] || 0) + 1;
            });
        }

        // Helper to update select options
        const updateSelect = (id, counts, dataForTotal, defaultLabel) => {
            const select = document.getElementById(id);
            if (!select) return;

            Array.from(select.options).forEach(opt => {
                const val = opt.value;
                let count = 0;
                let label = val;

                if (val === '') {
                    count = dataForTotal ? dataForTotal.length : 0;
                    label = defaultLabel;
                } else {
                    count = counts[val] || 0;
                }

                opt.textContent = `${label} (${count})`;
            });
        };

        updateSelect('filter-magang-status', statusCounts, statusData, 'Semua Status');
        updateSelect('filter-magang-kehadiran', kehadiranCounts, kehadiranData, 'Semua Kehadiran');
    }


    // ===== UPDATE MAGANG STATUS =====
    function updateMagangStatus(rowIndex, newStatus) {
        // Get the select element SAFE selection for filtered views
        const selectElement = document.querySelector(`.status-dropdown[data-row-index="${rowIndex}"]`);

        if (!selectElement) return;

        // Show loading state
        selectElement.disabled = true;

        // Get the full row data
        const rowData = { ...magangData[rowIndex] };
        const oldStatus = rowData['KET'];
        rowData['KET'] = newStatus;

        // Helper function to get status class
        const getStatusClass = (status) => {
            const statusMap = {
                'Sudah Diteruskan': 'status-sudah-diteruskan',
                'Sudah Dibuatkan SB': 'status-sudah-dibuatkan-sb',
                'Belum Dibuatkan SB': 'status-belum-dibuatkan-sb',
                'DITOLAK': 'status-ditolak'
            };
            return statusMap[status] || '';
        };

        // Call backend to update
        google.script.run
            .withSuccessHandler(function (response) {
                if (response.success) {
                    // Update local data
                    magangData[rowIndex]['KET'] = newStatus;

                    // Update CSS class for color
                    selectElement.className = 'status-dropdown ' + getStatusClass(newStatus);

                    showToast('success', 'Berhasil', 'Status berhasil diupdate');
                    selectElement.disabled = false;
                } else {
                    showToast('error', 'Error', response.message || 'Gagal update status');
                    // Revert dropdown
                    selectElement.value = oldStatus;
                    selectElement.disabled = false;
                }
            })
            .withFailureHandler(function (error) {
                showToast('error', 'Error', 'Gagal update status: ' + error.message);
                // Revert dropdown
                selectElement.value = oldStatus;
                selectElement.disabled = false;
            })
            .updateMagang(rowIndex, rowData, currentMagangSheet, getCurrentUserName());
    }

    // ===== AUTOCOMPLETE HELPER =====
    function setupLazyAutocomplete() {
        console.log('Setting up lazy autocomplete for Add Modal');

        // Helper to attach autocomplete logic
        const attachAutocomplete = (selector, fieldName, datalistId) => {
            const input = document.querySelector(selector);
            console.log(`Attaching autocomplete to ${selector}:`, input); // Log finding input

            if (!input) {
                console.warn(`Input not found: ${selector}`);
                return;
            }

            // Create datalist if not exists (or find existing)
            let datalist = document.getElementById(datalistId);
            if (!datalist) {
                datalist = document.createElement('datalist');
                datalist.id = datalistId;
                const form = document.getElementById('magang-form');
                if (form) form.appendChild(datalist);
                else document.body.appendChild(datalist);
                input.setAttribute('list', datalistId);
            }

            // Dynamically create loading indicator if not exists
            const loadingId = `loading-${fieldName.toLowerCase().replace(/\s+/g, '-')}-add`;
            let loadingSmall = document.getElementById(loadingId);
            if (!loadingSmall) {
                loadingSmall = document.createElement('small');
                loadingSmall.id = loadingId;
                loadingSmall.style.display = 'none';
                loadingSmall.style.color = '#6b7280';
                loadingSmall.style.fontSize = '11px';
                loadingSmall.style.marginTop = '4px';
                loadingSmall.style.display = 'none'; // Ensure hidden initially
                loadingSmall.textContent = 'Loading suggestions...';

                // Insert after input
                if (input.parentNode) {
                    input.parentNode.appendChild(loadingSmall);
                }
            }

            let isLoading = false;

            // Trigger on focus
            input.addEventListener('focus', function () {
                // 1. Check Cache
                if (typeof autocompleteCache !== 'undefined' && autocompleteCache[fieldName] && autocompleteCache[fieldName].length > 0) {
                    console.log(`Using cached ${fieldName}`);
                    datalist.innerHTML = autocompleteCache[fieldName].map(val => `<option value="${val}">`).join('');
                    return;
                }

                if (isLoading) return;
                isLoading = true;

                // Show loading text
                loadingSmall.style.display = 'block';

                // 2. Fetch from Backend
                google.script.run
                    .withSuccessHandler((response) => {
                        if (response.success && response.values) {
                            // Update Cache
                            if (typeof autocompleteCache !== 'undefined') {
                                autocompleteCache[fieldName] = response.values;
                            }
                            // Populate Datalist
                            datalist.innerHTML = response.values.map(val => `<option value="${val}">`).join('');
                        }
                        isLoading = false;
                        loadingSmall.style.display = 'none';
                    })
                    .withFailureHandler((err) => {
                        console.error(`Error loading ${fieldName}`, err);
                        isLoading = false;
                        loadingSmall.style.display = 'none';
                    })
                    .getUniqueColumnValues(fieldName, currentMagangSheet);
            });
        };

        // 1. Existing ID-based inputs
        attachAutocomplete('#input-universitas', 'UNIVERSITAS', 'universitas-list');
        attachAutocomplete('#input-jurusan', 'JURUSAN', 'jurusan-list');
        attachAutocomplete('#input-nomor-surat', 'NOMOR SURAT', 'nomor-surat-list');

        // 2. Name-based inputs (NOW USING IDS)
        attachAutocomplete('#input-pengirim-add', 'PENGIRIM', 'pengirim-list');
        attachAutocomplete('#input-jabatan-add', 'JABATAN', 'jabatan-list');
        attachAutocomplete('#input-unit-kerja-add', 'UNIT KERJA', 'unit-kerja-list');
        attachAutocomplete('#input-pembimbing-add', 'PEMBIMBING', 'pembimbing-list');
    }

    // ===== SUBMIT FUNCTION =====
    function submitMagang() {
        console.log('🚀 SUBMIT MAGANG (BULK) CALLED');
        const form = document.getElementById('magang-form');

        if (form && form.hasAttribute('data-index')) {
            showToast('error', 'Error', 'Form edit tidak boleh menambah data');
            return;
        }

        if (!form) {
            showToast('error', 'Error', 'Form tidak ditemukan');
            return;
        }

        // Validate "Data Umum" inputs
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        // 1. Collect Common Data (Shared)
        const formData = new FormData(form);
        const commonData = {};
        formData.forEach((value, key) => {
            if (key !== 'No' && key !== 'NO' && key.trim() !== '') {
                commonData[key] = value;
            }
        });

        // Convert dates in commonData to ISO format
        ['TGL MSK SURAT', 'TGL MASUK', 'TGL SELESAI'].forEach(dateField => {
            if (commonData[dateField]) {
                const dateVal = new Date(commonData[dateField]);
                if (!isNaN(dateVal.getTime())) {
                    commonData[dateField] = dateVal.toISOString().split('T')[0];
                }
            }
        });

        // 2. Collect Student Data from Table
        const tbody = document.getElementById('student-list-body');
        const studentsList = [];

        if (tbody) {
            const rows = tbody.querySelectorAll('tr');
            rows.forEach(row => {
                const nameInput = row.querySelector('.student-name');
                const nimInput = row.querySelector('.student-nim');
                const phoneInput = row.querySelector('.student-phone');
                const judulInput = row.querySelector('.student-judul');

                // Only add if Name is present
                if (nameInput && nameInput.value.trim() !== '') {
                    studentsList.push({
                        'NAMA MAHASISWA': nameInput.value.trim(),
                        'STAMBUK / NIM': nimInput ? nimInput.value.trim() : '',
                        'PHONE': phoneInput ? phoneInput.value.trim() : '',
                        'JUDUL PENELITIAN': judulInput ? judulInput.value.trim() : ''
                    });
                }
            });
        }

        if (studentsList.length === 0) {
            showToast('warning', 'Peringatan', 'Mohon isi minimal 1 nama mahasiswa.');
            return;
        }

        // Disable submit button
        const submitBtn = document.querySelector('.modal-footer .btn-primary');
        let originalBtnText = 'Simpan Semua Data';
        if (submitBtn) {
            originalBtnText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = `Menyimpan ${studentsList.length} Data...`;
        }

        console.log('Sending Bulk Data:', { commonData, studentsList });

        // DETERMINE TARGET SHEET
        // Priority: explicit attribute > global variable > default
        let targetSheetName = form.getAttribute('data-target-sheet');
        if (!targetSheetName) {
            targetSheetName = currentMagangSheet || 'Data Magang';
        }
        console.log('Target Sheet for Saving:', targetSheetName);

        // 3. Call Backend addMultipleMagang (Must be SINGLE OBJECT payload)
        const payload = {
            sharedData: commonData,
            students: studentsList,
            targetSheet: targetSheetName,
            userLog: getCurrentUserName() // [NEW] Add current user for activity logging
        };

        google.script.run
            .withSuccessHandler(function (response) {
                if (response.success) {
                    showToast('success', 'Berhasil', `${response.count || studentsList.length} data magang berhasil ditambahkan ke ${targetSheetName}`);

    function updateStudentRowNumbers() {
        const tbody = document.getElementById('student-list-body');
        const inputNo = document.getElementById('input-no-magang');
        let baseNo = 1;
        let useAuto = false;

        // Priority 1: Get from dataset (most reliable)
        if (inputNo && inputNo.dataset.baseNo) {
            baseNo = parseInt(inputNo.dataset.baseNo);
            useAuto = true;
        }
        // Priority 2: Get from current value (fallback)
        else if (inputNo && inputNo.value && !isNaN(parseInt(inputNo.value))) {
            baseNo = parseInt(inputNo.value);
            useAuto = true;
        }

        if (tbody) {
            const rowCount = tbody.rows.length;

            // 1. Update Table Rows
            Array.from(tbody.rows).forEach((row, index) => {
                const cell = row.cells[0];
                if (useAuto) {
                    cell.innerText = baseNo + index;
                    cell.style.fontWeight = 'bold';
                    cell.style.color = 'var(--primary-color)';
                } else {
                    cell.innerText = index + 1;
                    cell.style.fontWeight = 'normal';
                    cell.style.color = 'var(--text-secondary)';
                }
            });

            // 2. Update Input Display (Range)
            if (useAuto && inputNo) {
                if (rowCount > 1) {
                    const lastNo = baseNo + rowCount - 1;
                    inputNo.value = `${baseNo} - ${lastNo}`;
                } else {
                    inputNo.value = baseNo;
                }
            }
        }
    }

            }

    function submitMagang() {
        console.log('🚀 SUBMIT MAGANG (BULK) CALLED');
        const form = document.getElementById('magang-form');

        if (form && form.hasAttribute('data-index')) {
            showToast('error', 'Error', 'Form edit tidak boleh menambah data');
            return;
        }

        if (!form) {
            showToast('error', 'Error', 'Form tidak ditemukan');
            return;
        }

        // Validate "Data Umum" inputs
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        // 1. Collect Common Data (Shared)
        const formData = new FormData(form);
        const commonData = {};
        formData.forEach((value, key) => {
            // Exclude "No" logic just in case, and exclude empty string keys
            if (key !== 'No' && key !== 'NO' && key.trim() !== '') {
                commonData[key] = value;
            }
        });

        // Convert dates in commonData to ISO format
        ['TGL MSK SURAT', 'TGL MASUK', 'TGL SELESAI'].forEach(dateField => {
            if (commonData[dateField]) {
                const dateVal = new Date(commonData[dateField]);
                if (!isNaN(dateVal.getTime())) {
                    commonData[dateField] = dateVal.toISOString().split('T')[0];
                }
            }
        });

        // 2. Collect Student Data from Table
        const tbody = document.getElementById('student-list-body');
        const studentsList = [];

        if (tbody) {
            const rows = tbody.querySelectorAll('tr');
            rows.forEach(row => {
                const nameInput = row.querySelector('.student-name');
                const nimInput = row.querySelector('.student-nim');
                const phoneInput = row.querySelector('.student-phone');
                const judulInput = row.querySelector('.student-judul');

                // Only add if Name is present
                if (nameInput && nameInput.value.trim() !== '') {
                    studentsList.push({
                        'NAMA MAHASISWA': nameInput.value.trim(),
                        'STAMBUK / NIM': nimInput ? nimInput.value.trim() : '',
                        'PHONE': phoneInput ? phoneInput.value.trim() : '',
                        'JUDUL PENELITIAN': judulInput ? judulInput.value.trim() : ''
                    });
                }
            });
        }

        if (studentsList.length === 0) {
            showToast('warning', 'Peringatan', 'Mohon isi minimal 1 nama mahasiswa.');
            return;
        }

        // Disable submit button
        const submitBtn = document.querySelector('.modal-footer .btn-primary');
        let originalBtnText = 'Simpan Semua Data';
        if (submitBtn) {
            originalBtnText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = `Menyimpan ${studentsList.length} Data...`;
        }

        console.log('Sending Bulk Data:', { commonData, studentsList });

        // Determine Target Sheet with Robust Fallback
        let targetSheetName = currentMagangSheet;

        // 1. Try from Form Attribute (set by showAddMagangModal)
        if (form && form.hasAttribute('data-target-sheet')) {
            const attrSheet = form.getAttribute('data-target-sheet');
            if (attrSheet && attrSheet.trim() !== '') {
                targetSheetName = attrSheet;
                console.log('Target Sheet detected from Form Attribute:', targetSheetName);
            }
        }

        // 2. Fallback: Try scraping from Page Title (if global/attribute fails or matches default "Data Magang" but user might be in a batch)
        // This handles cases where scripts reloaded but UI title persisted
        const titleElem = document.getElementById('magang-batch-title');
        if (titleElem) {
            const titleText = titleElem.innerText || titleElem.textContent;
            // Expected format: "Data Magang - Mei 2026"
            if (titleText && titleText.includes(' - ')) {
                const parts = titleText.split(' - ');
                if (parts.length > 1) {
                    const fromTitle = parts[1].trim();
                    // If we found a specific batch name in title, prefer it over the generic default
                    if (fromTitle && targetSheetName === 'Data Magang') {
                        targetSheetName = fromTitle;
                        console.log('Target Sheet overridden by Page Title:', targetSheetName);
                    }
                }
            }
        }

        console.log('Final Target Sheet for Payload:', targetSheetName);

        // 3. Call Backend addMultipleMagang (Must be SINGLE OBJECT payload)
        const payload = {
            sharedData: commonData,
            students: studentsList,
            targetSheet: targetSheetName,
            userLog: getCurrentUserName() // [NEW] Add current user for activity logging
        };

        google.script.run
            .withSuccessHandler(function (response) {
                if (response.success) {
                    showToast('success', 'Berhasil', `${response.count || studentsList.length} data magang berhasil ditambahkan`);
                    closeModal();
                    loadMagangData();
                    loadDashboardData(); // Refresh dashboard stats
                } else {
                    showToast('error', 'Error', response.message || 'Gagal menambahkan data');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalBtnText;
                    }
                }
            })
            .withFailureHandler(function (error) {
                console.error('Add Magang Failed:', error);
                showToast('error', 'Error', 'Gagal: ' + error.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                }
            })
            .addMultipleMagang(payload);

    }

        // ===== LAZY LOADING AUTOCOMPLETE FOR EDIT ENDPOINT =====

        // Helper to attach autocomplete logic inside modal
        const attachEditAutocomplete = (inputId, listId, fieldName, loadingId = null) => {
            const input = document.getElementById(inputId);
            if (!input) return;

            let isLoading = false;
            input.addEventListener('focus', function () {
                // Check cache first
                if (typeof autocompleteCache !== 'undefined' && autocompleteCache[fieldName]) {
                    console.log(`Using cached ${fieldName} (Edit Modal)`);
                    const datalist = document.getElementById(listId);
                    if (datalist) {
                        datalist.innerHTML = autocompleteCache[fieldName].map(val => `<option value="${val}">`).join('');
                    }
                    return;
                }

                if (isLoading) return;
                isLoading = true;

                const loadingIndicator = loadingId ? document.getElementById(loadingId) : null;
                const originalPlaceholder = input.placeholder;

                if (loadingIndicator) loadingIndicator.style.display = 'block';
                else input.placeholder = 'Loading tags...';

                google.script.run
                    .withSuccessHandler(function (response) {
                        if (response.success && response.values) {
                            if (typeof autocompleteCache !== 'undefined') {
                                autocompleteCache[fieldName] = response.values;
                            }

                            const datalist = document.getElementById(listId);
                            if (datalist) {
                                datalist.innerHTML = response.values.map(val => `<option value="${val}">`).join('');
                            }
                        }
                        if (loadingIndicator) loadingIndicator.style.display = 'none';
                        else input.placeholder = originalPlaceholder;
                        isLoading = false;
                    })
                    .withFailureHandler(function (error) {
                        console.error(`Error loading ${fieldName}:`, error);
                        if (loadingIndicator) loadingIndicator.style.display = 'none';
                        else input.placeholder = originalPlaceholder;
                        isLoading = false;
                    })
                    .getUniqueColumnValues(fieldName, currentMagangSheet);
            });
        };

        // Attach logic to fields
        attachEditAutocomplete('input-universitas-edit', 'universitas-list-edit', 'UNIVERSITAS', 'loading-universitas-edit');
        attachEditAutocomplete('input-jurusan-edit', 'jurusan-list-edit', 'JURUSAN', 'loading-jurusan-edit');
        attachEditAutocomplete('input-nomor-surat-edit', 'nomor-surat-list-edit', 'NOMOR SURAT', 'loading-nomor-surat-edit');

        // New fields
        attachEditAutocomplete('input-pengirim-edit', 'pengirim-list-edit', 'PENGIRIM', 'loading-pengirim-edit');
        attachEditAutocomplete('input-jabatan-edit', 'jabatan-list-edit', 'JABATAN', 'loading-jabatan-edit');
        attachEditAutocomplete('input-pembimbing-edit', 'pembimbing-list-edit', 'PEMBIMBING', 'loading-pembimbing-edit');
        attachEditAutocomplete('input-unit-kerja-edit', 'unit-kerja-list-edit', 'UNIT KERJA', 'loading-unit-kerja-edit');
    }

    function submitEditMagang() {
        const form = document.getElementById('magang-form-edit');
        if (!form) {
            showToast('error', 'Error', 'Form edit tidak ditemukan');
            return;
        }
        const index = parseInt(form.getAttribute('data-index'));

        if (isNaN(index)) {
            alert('Index tidak valid');

        if (!form.checkValidity()) {
            form.reportValidity();

        }

        const formData = new FormData(form);
        const data = {};

        formData.forEach((value, key) => {
            data[key] = value;
        });

        // Konversi tanggal
        if (data['TGL MASUK']) {
            data['TGL MASUK'] = new Date(data['TGL MASUK']).toISOString().split('T')[0];
        }
        if (data['TGL SELESAI']) {
            data['TGL SELESAI'] = new Date(data['TGL SELESAI']).toISOString().split('T')[0];
        }

        google.script.run
            .withSuccessHandler(res => {
                if (res.success) {

                    showToast('success', 'Berhasil', 'Data magang berhasil diupdate');

                    showToast('error', 'Gagal', res.message);
                }
            })
            .withFailureHandler(err => {
                showToast('error', 'Error', err.message);
            })
            .updateMagang(index, data, currentMagangSheet, getCurrentUserName());
    }

    // Helper function to format date for input type="date"
    function formatDateForInput(dateStr) {
        if (!dateStr) return '';

        if (dateStr instanceof Date) {
            const year = dateStr.getFullYear();
            const month = String(dateStr.getMonth() + 1).padStart(2, '0');
            const day = String(dateStr.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const str = String(dateStr).trim();

        // 1. Check Standard ISO (2026-01-14)
        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
            return str;
        }

        // 2. Check ISO with Time (2026-01-14T...)
        if (str.includes('T') && str.length >= 10) {
            const d = new Date(str);
            if (!isNaN(d.getTime())) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            return str.split('T')[0];
        }

        // 3. Check "14 Januari 2026" (DD Month YYYY)
        // Split by space
        const parts = str.replace(/[\/\-\.]/g, ' ').split(/\s+/);

        if (parts.length === 3) {
            let day = parts[0];
            let month = parts[1];
            let year = parts[2];

            // Swap if format is YYYY MM DD? No, stick to "14 Januari 2026" logic first.
            // But make sure 'year' is 4 digits. If parts[0] is 4 digits, usage might be reversed.
            if (day.length === 4 && year.length <= 2) {
                // Swap
                [day, year] = [year, day];
            }

            if (year.length === 4) {
                // Normalize Month
                const monthMap = {
                    'jan': '01', 'januari': '01', 'january': '01', '01': '01', '1': '01',
                    'feb': '02', 'februari': '02', 'february': '02', '02': '02', '2': '02',
                    'mar': '03', 'maret': '03', 'march': '03', '03': '03', '3': '03',
                    'apr': '04', 'april': '04', '04': '04', '4': '04',
                    'mei': '05', 'may': '05', '05': '05', '5': '05',
                    'jun': '06', 'juni': '06', 'june': '06', '06': '06', '6': '06',
                    'jul': '07', 'juli': '07', 'july': '07', '07': '07', '7': '07',
                    'aug': '08', 'agustus': '08', 'august': '08', 'ags': '08', '08': '08', '8': '08',
                    'sep': '09', 'september': '09', '09': '09', '9': '09',
                    'okt': '10', 'oktober': '10', 'oct': '10', 'october': '10', '10': '10',
                    'nov': '11', 'november': '11', '11': '11',
                    'des': '12', 'desember': '12', 'dec': '12', 'december': '12', '12': '12'
                };

                const mKey = month.toLowerCase();
                let monthNum = month;
                if (monthMap[mKey]) {
                    monthNum = monthMap[mKey];
                } else if (!isNaN(month)) {
                    // Keep numeric month if not in map but numeric
                    monthNum = month.padStart(2, '0');
                }

                day = day.padStart(2, '0');
                return `${year}-${monthNum}-${day}`;
            }
        }

        return '';
    }

    function exportDataPDF() {
        try {
            showToast('info', 'Exporting...', 'Sedang membuat PDF');

            // Get filtered data that is currently displayed
            let dataToExport = karyawanFilteredData.length > 0 ? karyawanFilteredData : karyawanData;

            // Apply row limit if not "all"
            if (currentRowsPerPage !== 'all') {
                dataToExport = dataToExport.slice(0, parseInt(currentRowsPerPage));
            }

            // Check if jsPDF is loaded
            if (typeof window.jspdf === 'undefined') {
                showToast('error', 'Error', 'jsPDF library tidak dimuat. Refresh halaman dan coba lagi.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4'); // Landscape orientation

            // Add title
            doc.setFontSize(18);
            doc.setTextColor(102, 126, 234); // Purple color
            doc.text('Data Karyawan', 14, 15);

            // Add date
            doc.setFontSize(10);
            doc.setTextColor(100);
            const dateStr = new Date().toLocaleDateString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            doc.text(`Exported: ${dateStr} `, 14, 22);

            // Prepare table data
            const headers = karyawanHeaders;
            const tableData = dataToExport.map(row => {
                return headers.map(header => row[header] || '-');
            });

            // Add table
            doc.autoTable({
                head: [headers],
                body: tableData,
                startY: 28,
                theme: 'grid',
                styles: {
                    fontSize: 8,
                    cellPadding: 2,
                    overflow: 'linebreak',
                },
                headStyles: {
                    fillColor: [102, 126, 234],
                    textColor: 255,
                    fontStyle: 'bold',
                    halign: 'center'
                },
                columnStyles: {
                    0: { cellWidth: 'auto' },
                },
                margin: { top: 28, right: 14, bottom: 14, left: 14 },
            });

            // Add page numbers
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(150);
                doc.text(
                    `Page ${i} of ${pageCount} `,
                    doc.internal.pageSize.getWidth() - 30,
                    doc.internal.pageSize.getHeight() - 10
                );
            }

            // Save PDF
            const fileName = `Data_Karyawan_${new Date().toISOString().split('T')[0]}.pdf`;
            doc.save(fileName);

            showToast('success', 'Berhasil', 'PDF berhasil diexport');

    function generatePreviewRows(students) {
        console.log('generatePreviewRows called with:', students);
        if (!students || students.length === 0) {
            return '<div style="padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px;">Tidak ada mahasiswa terpilih</div>';
        }

        const slice = students.slice(0, 10); // Show max 10

        // Helper to find key value case-insensitive
        const findVal = (item, ...candidates) => {
            const keys = Object.keys(item);
            for (const c of candidates) {
                const k = keys.find(key => key.toUpperCase().trim() === c.toUpperCase().trim());
                if (k) return item[k];
            }
            return '-';
        };

        let html = slice.map((s, i) => {
            const nama = findVal(s, 'NAMA MAHASISWA', 'NAMA', 'NAME', 'MAHASISWA');
            const stambuk = findVal(s, 'STAMBUK', 'NIM', 'NIS', 'NO. INDUK', 'STAMBUK / NIM');

            return `
<div
    style="display: flex; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--border-color); font-size: 12px;">
    <span style="color: var(--text-muted); width: 24px;">${i + 1}.</span>
    <span style="font-weight: 500; flex: 1; color: var(--text-primary);">${nama}</span>
    <span style="color: var(--text-secondary);">${stambuk}</span>
</div>
`;
        }).join('');

        if (students.length > 10) {
            html += `<div
    style="padding: 8px; text-align: center; color: var(--text-secondary); font-size: 11px; background: var(--bg-tertiary);">
    ... dan ${students.length - 10} lainnya</div>`;
        }
        return html;
    }

    function handleGenerateSuratPenolakan() {
        // Gather Data
        const form = document.getElementById('surat-penolakan-form');
        const formData = new FormData(form);
        const headerData = {};
        formData.forEach((v, k) => headerData[k] = v);

        const students = selectedStudentsForSurat;
        if (!students || students.length === 0) {
            showToast('warning', 'Peringatan', 'Tidak ada data siswa yang dipilih.');
            return;
        }

        // UX: Loading State
        const btn = document.getElementById('btn-generate-penolakan');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Generating...';
        showToast('info', 'Generating PDF', 'Mohon tunggu, sedang memproses dokumen...');

        // Verify Nomor Surat (Original Incoming Letter Number)
        // We use the first student's nomor surat as the "key" to fetch data in Backend,
        // OR we pass the students directly?
        // Backend `generateSuratPenolakanPDF` takes (nomorSurat, headerData, sheetName). 
        // So we need to pass a VALID nomor surat from the student data to let backend fetch it again?
        // OR we should find a key that represents the common incoming letter number.

        let nomorSuratIncoming = "";
        const findKey = (item, candidates) => {
            const keys = Object.keys(item);
            const upperCandidates = candidates.map(c => c.toUpperCase());
            const foundKey = keys.find(k => upperCandidates.includes(k.toUpperCase()));
            return foundKey ? item[foundKey] : null;
        };

        if (students.length > 0) {
            nomorSuratIncoming = findKey(students[0], ['NO. SURAT', 'NOMOR SURAT', 'NO SURAT']);
        }

        if (!nomorSuratIncoming || nomorSuratIncoming.trim() === '') {
            // Fallback: If we can't find a valid incoming letter number, the backend lookup might fail.
            // But let's try anyway or warn.
            console.warn("No Incoming Letter Number found on selected students.");
        }

        google.script.run
            .withSuccessHandler(function (response) {
                btn.disabled = false;
                btn.textContent = originalText;

                if (response.success) {
                    showToast('success', 'Berhasil', 'PDF berhasil dibuat!');
                    closeModal(); // Close form modal

                    // Show Preview Modal instead of opening new tab
                    // response.pdfUrl is usually a /view or /download link. showPdfPreviewModal handles conversion.
                    // We pass null for docxUrl since it's not implemented for Penolakan yet.
                    // FIX: Use response.previewUrl for the iframe source
                    showPdfPreviewModal(response.previewUrl, response.pdfUrl, response.fileName, response.docxUrl);

                } else {
                    showToast('error', 'Gagal', response.message);
                }
            })
            .withFailureHandler(function (error) {
                btn.disabled = false;
                btn.textContent = originalText;
                showToast('error', 'Error', 'Gagal memanggil server: ' + error.message);
            })
            // Use current sheet name context
            .generateSuratPenolakanPDF(nomorSuratIncoming, headerData, currentMagangSheet);
    }

    function animateValue(element, start, end, duration) {
        if (!element) return;

        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const value = Math.floor(progress * (end - start) + start);
            element.textContent = value;
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }

    /**

    function closeModal(arg) {
        // Case 1: Event object (from overlay click in generic modal)
        if (arg && (arg instanceof Event || arg.target)) {
            if (arg.target.classList.contains('modal-overlay')) {
                const container = document.getElementById('modal-container');
                if (container) container.innerHTML = '';
            }
            return;
        }

        // Case 2: String ID (specific modal)
        if (typeof arg === 'string') {
            const modal = document.getElementById(arg);
            if (modal) {
                modal.remove();
            }
            return;
        }

        // Case 3: No argument (generic close button)
        const container = document.getElementById('modal-container');
        if (container) container.innerHTML = '';
    }

    /**
     * Close modal when clicking overlay

    function closeModalOnOverlayClick(event, modalId) {

    /**
     * Load preview mahasiswa by nomor surat
     */
    function loadPreviewMahasiswa(nomorSurat) {
        const previewContainer = document.getElementById('preview-container');
        const previewTableBody = document.getElementById('preview-table-body');
        const previewInfo = document.getElementById('preview-info');
        const btnGenerate = document.getElementById('btn-generate-surat');
        const warningContainer = document.getElementById('warning-container');
        const warningText = document.getElementById('warning-text');
        const headerFormContainer = document.getElementById('header-form-container');

        if (!nomorSurat || nomorSurat === '') {
            previewContainer.style.display = 'none';
            headerFormContainer.style.display = 'none';
            btnGenerate.disabled = true;
            return;
        }

        // Show header form
        headerFormContainer.style.display = 'block';

        // Show loading
        previewTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>';
        previewContainer.style.display = 'block';
        btnGenerate.disabled = true;

        console.log('Calling getDataByNomorSurat with:', nomorSurat);

        // Set timeout to prevent infinite loading
        const timeoutId = setTimeout(function () {
            previewTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ef4444;">Timeout: Server tidak merespon. Coba refresh halaman.</td></tr>';
            btnGenerate.disabled = true;
            showToast('error', 'Timeout', 'Server terlalu lama merespon');
        }, 30000); // 30 second timeout

        google.script.run
            .withSuccessHandler(function (response) {
                clearTimeout(timeoutId);
                console.log('Success response:', response);

                try {
                    // Validate response structure
                    if (!response) {
                        throw new Error('Response is null or undefined');
                    }

                    if (!response.success) {
                        previewTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ef4444;">${response.message || 'Error tidak diketahui'}</td></tr>`;
                        btnGenerate.disabled = true;
                        showToast('error', 'Error', response.message || 'Gagal memuat data');
                        return;
                    }

                    if (!response.data) {
                        throw new Error('Response data is undefined');
                    }

                    const mahasiswa = response.data.mahasiswa || [];
                    const common = response.data.common || {};
                    const totalCount = response.data.totalCount || 0;





                    // Extract Perihal, Kepada, Jabatan from first student
                    const firstStudent = mahasiswa[0] || {};

                    // Helper: Case-insensitive key lookup
                    const getValueCI = (obj, ...candidateKeys) => {
                        const objKeysLower = Object.keys(obj).reduce((acc, k) => {
                            acc[k.toLowerCase().trim()] = obj[k];
                            return acc;
                        }, {});

                        for (const key of candidateKeys) {
                            const normalizedKey = key.toLowerCase().trim();
                            if (objKeysLower[normalizedKey] && objKeysLower[normalizedKey].toString().trim() !== '') {
                                return objKeysLower[normalizedKey];
                            }
                        }
                        return '-';
                    };

                    // Try multiple column name variations (case-insensitive)
                    const perihal = getValueCI(firstStudent, 'PERIHAL', 'JUDUL PENELITIAN', 'Perihal');
                    const kepada = getValueCI(firstStudent, 'PENGIRIM', 'KEPADA', 'Pengirim', 'NAMA PENGIRIM');
                    const jabatan = getValueCI(firstStudent, 'JABATAN', 'PEKERJAAN', 'Jabatan');



                    // Store for PDF generation
                    window._cachedHeaderData = { perihal, kepada, jabatan };

                    // Update info
                    previewInfo.innerHTML = `
                        <strong>Nomor Surat:</strong> ${common.nomorSurat || '-'} <br>
                        <strong>Universitas:</strong> ${common.universitas || '-'} <br>
                        <strong>Jurusan:</strong> ${common.jurusan || '-'} <br>
                        <strong>Periode:</strong> ${common.tglMulai || '-'} s/d ${common.tglSelesai || '-'} <br>
                        <strong>Perihal:</strong> ${perihal} <br>
                        <strong>Kepada Yth:</strong> ${kepada} <br>
                        <strong>Jabatan:</strong> ${jabatan} <br>
                        <strong>Jumlah Mahasiswa:</strong> ${totalCount} orang (${mahasiswa.length} akan di-generate)
                    `;

                    // Populate table
                    if (mahasiswa.length > 0) {
                        previewTableBody.innerHTML = mahasiswa.map((mhs, index) => {
                            // Use helper to extract data insensitive of case/exact name
                            const nama = getValueCI(mhs, 'NAMA MAHASISWA', 'NAMA', 'NAME', 'nama');
                            const nis = getValueCI(mhs, 'STAMBUK', 'NIS', 'NIM', 'NO. INDUK', 'nis');
                            const jurusan = getValueCI(mhs, 'JURUSAN', 'PRODI', 'PROGRAM STUDI', 'jurusan');

                            return `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${nama || '-'}</td>
                                <td>${nis || '-'}</td>
                                <td>${jurusan || '-'}</td>
                            </tr>
                        `}).join('');

                        btnGenerate.disabled = false;
                    } else {
                        previewTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Tidak ada data mahasiswa</td></tr>';
                        btnGenerate.disabled = true;
                    }

                    // Show warning if > 8 students
                    if (response.warning) {
                        warningText.textContent = response.warning;
                        warningContainer.style.display = 'block';
                    } else {
                        warningContainer.style.display = 'none';
                    }
                } catch (error) {
                    console.error('Error processing response:', error);
                    previewTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ef4444;">Error: ${error.message}</td></tr>`;
                    btnGenerate.disabled = true;
                    showToast('error', 'Error', 'Gagal memproses data: ' + error.message);
                }
            })
            .withFailureHandler(function (error) {
                clearTimeout(timeoutId);
                console.error('Failure handler called:', error);
                const errorMsg = error && error.message ? error.message : 'Error tidak diketahui';
                previewTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ef4444;">Error: ${errorMsg}</td></tr>`;
                btnGenerate.disabled = true;
                showToast('error', 'Error', 'Gagal memuat preview: ' + errorMsg);
            })
            .getDataByNomorSurat(nomorSurat, currentMagangSheet);
    }

    function exportAnalyticsToPDF() {
        const { jsPDF } = window.jspdf;
        const element = document.getElementById('page-analytics');

        // Hide controls
        const buttons = element.querySelectorAll('button, input');
        buttons.forEach(btn => btn.style.visibility = 'hidden');

        showToast('info', 'Generating Report...', 'Mohon tunggu sebentar...');

        const isDarkMode = document.body.classList.contains('dark-mode');
        const bgColor = isDarkMode ? '#1f2937' : '#ffffff'; // Match dashboard background

        html2canvas(element, {
            scale: 2,
            useCORS: true,
            backgroundColor: bgColor
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save('Laporan_Analitik_DiklatHub.pdf');

            // Restore controls
            buttons.forEach(btn => btn.style.visibility = 'visible');
            showToast('success', 'Berhasil', 'Laporan berhasil diunduh');
        }).catch(err => {
            console.error('PDF Export Error:', err);
            buttons.forEach(btn => btn.style.visibility = 'visible');
            showToast('error', 'Gagal', 'Gagal membuat PDF: ' + err.message);
        });
    }

    function loadPengaturanPage() {

    function loadActivityLogPage() {

    function populateLogUserFilter(logs) {
        const userSet = new Set();
        logs.forEach(log => {
            if (log.user) userSet.add(log.user);
        });

        const select = document.getElementById('filter-log-user');
        if (select) {
            const optionsHtml = Array.from(userSet).sort().map(u => `<option value="${u}">${u}</option>`).join('');
            select.innerHTML = '<option value="">Semua User</option>' + optionsHtml;
        }
    }

    function applyLogFilters() {
        const userFilter = document.getElementById('filter-log-user').value;
        const actionFilter = document.getElementById('filter-log-action').value;
        const dateFilter = document.getElementById('filter-log-date').value;

        let filtered = allLogs;

        // Filter User
        if (userFilter) {
            filtered = filtered.filter(l => l.user === userFilter);
        }

        // Filter Action (Partial Match)
        if (actionFilter) {
            filtered = filtered.filter(l => l.action.includes(actionFilter));
        }

        // Filter Date
        if (dateFilter) {
            filtered = filtered.filter(l => l.timestampRaw >= new Date(dateFilter).setHours(0, 0, 0, 0) &&
                l.timestampRaw <= new Date(dateFilter).setHours(23, 59, 59, 999));
        }

        renderLogTable(filtered);
    }

    function resetLogFilters() {
        document.getElementById('filter-log-user').value = '';
        document.getElementById('filter-log-action').value = '';
        document.getElementById('filter-log-date').value = '';
        applyLogFilters();
    }

    function renderLogTable(logs) {
        const tbody = document.getElementById('log-table-body');
        if (!tbody) return;

        if (logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Tidak ada log ditemukan.</td></tr>';
            return;
        }

        // Retrieve user color preference for highlights
        const userColor = localStorage.getItem('logColor') || '#f093fb';

        tbody.innerHTML = logs.map(log => {
            // Parse Details similar to dashboard
            let displayDetails = log.details || '';
            let metaData = null;

            const metaMatch = displayDetails.match(/\[REF:(.*?):(\d+)\]/);
            if (metaMatch) {
                metaData = { sheet: metaMatch[1], row: parseInt(metaMatch[2]) };
                displayDetails = displayDetails.replace(metaMatch[0], '');
            }

            // Format Diff
            if (displayDetails.includes('->')) {
                displayDetails = displayDetails.split(', ').map(change => {
                    return `<div style="font-size:11px; color:var(--text-secondary);">&bull; ${change}</div>`;
                }).join('');
            }

            // Clickable Subject
            let subjectHtml = `<strong style="color:var(--text-primary);">${log.subject}</strong>`;
            if (metaData) {
                subjectHtml = `<strong style="cursor:pointer; color:${userColor}; text-decoration:underline;" 
                                onclick="handleLogClick('${metaData.sheet}', ${metaData.row})" 
                                title="Lihat Data">${log.subject}</strong>`;
            }

            return `
                <tr>
                    <td style="white-space:nowrap; font-size:12px; color:var(--text-secondary);">${log.time}</td>
                    <td style="font-weight:600;">${log.user}</td>
                    <td><span class="badge ${getActionBadgeClass(log.action)}">${log.action}</span></td>
                    <td>${subjectHtml}</td>
                    <td style="max-width:300px;">${displayDetails}</td>
                </tr>
            `;
        }).join('');
    }

    function getActionBadgeClass(action) {
        if (action.includes('Mengedit')) return 'badge-warning'; // Yellowish
        if (action.includes('Menambahkan')) return 'badge-success'; // Greenish

        return 'badge-neutral';

    function updateNomorSuffix(dateStr) {
        const preview = document.getElementById('nomor-suffix-preview');
        if (!preview) return;

        // Default invalid
        let suffix = '01-' + new Date().getFullYear();

        if (dateStr) {
            // Try to parse partial date like "29 Januari 2026"
            // Simple approach: Split by space, get last (year) and find month index
            const parts = dateStr.split(' ');
            if (parts.length >= 3) {
                const year = parts[parts.length - 1]; // Last part is year
                const monthName = parts[1]; // Middle is month
                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                const monthIdx = months.findIndex(m => m.toLowerCase() === monthName.toLowerCase());

                if (monthIdx !== -1) {
                    const monthStr = (monthIdx + 1).toString().padStart(2, '0');
                    suffix = `${monthStr}-${year}`;
                }
            }
        }
        preview.value = suffix;
    }

    function startMagangTutorial() {
        tutorialStep = 0;

        // Buat overlay jika belum ada
        if (!document.getElementById('tutorial-overlay')) {
            const overlay = document.createElement('div');
            overlay.id = 'tutorial-overlay';

        // Buat tooltip box jika belum ada

        document.getElementById('tutorial-overlay').classList.add('active');

    function showTutorialStep(stepIndex) {
        if (stepIndex >= tutorialSteps.length) {
            endTutorial();
            return;
        }

        // Hapus highlight dari semua elemen sebelumnya
        document.querySelectorAll('.tutorial-highlight').forEach(el => {
            el.classList.remove('tutorial-highlight');
        });

        const step = tutorialSteps[stepIndex];

        // Jalankan fungsi setup UI yang dibutuhkan langkah tutorial ini
        if (typeof step.setup === 'function') {
            step.setup();
        }

        // Tunggu sebentar lalu cari elemen
        setTimeout(() => {
            let targetEl = document.querySelector(step.element);

            // Coba cari alternatif jika querySelector awal meleset karena selector dinamis
            if (!targetEl && stepIndex === 1) targetEl = document.querySelector('button[onclick*="showCreateBatchModal"]');
            if (!targetEl && stepIndex === 3) targetEl = document.querySelector('button[onclick*="showAddMagangModal"]');
            if (!targetEl && stepIndex === 4) targetEl = document.querySelector('button[onclick*="showExportSuratBalasanModal"]');
            if (!targetEl && stepIndex === 5) targetEl = document.querySelector('button[onclick*="showExportSuratPengantarModal"]');

            if (!targetEl || targetEl.style.display === 'none' || targetEl.offsetParent === null) {
                // Jika elemen tidak ditemukan/disembunyikan (misal gara2 hak akses), lanjut ke step berikutnya
                console.warn('Elemen tutorial tidak ditemukan atau disembunyikan:', step.element, ' - Beralih ke step selanjutnya');

                // Hati-hati jika ini step terakhir tapi tidak terlihat
                if (stepIndex === tutorialSteps.length - 1) {
                    endTutorial();
                } else {
                    showTutorialStep(stepIndex + 1);
                }
                return;
            }

            // Scroll agar elemen terlihat
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Tambahkan efek highlight
            targetEl.classList.add('tutorial-highlight');

            // Render Tooltip
            const tooltip = document.getElementById('tutorial-tooltip');

            // Render dots
            let dotsHtml = '';
            for (let i = 0; i < tutorialSteps.length; i++) {
                dotsHtml += `<div class="tutorial-dot ${i === stepIndex ? 'active' : ''}"></div>`;
            }

            tooltip.innerHTML = `
                <div class="tutorial-tooltip-header">
                    ${step.title}
                </div>
                <div class="tutorial-tooltip-body">
                    ${step.text}
                </div>
                <div class="tutorial-tooltip-footer">
                    <button class="tutorial-btn-close" onclick="endTutorial()">Skip</button>
                    <div class="tutorial-nav-dots">
                        ${dotsHtml}
                    </div>
                    <button class="btn-primary btn-sm" onclick="nextTutorialStep()" style="padding: 6px 16px; font-size: 13px; border-radius: 6px;">
                        ${stepIndex === tutorialSteps.length - 1 ? 'Selesai' : 'Lanjut'}
                    </button>
                </div>
            `;

            // Posisi tooltip
            const rect = targetEl.getBoundingClientRect();
            tooltip.classList.remove('active'); // Reset animasi masuk

            setTimeout(() => {
                tooltip.classList.add('active');

                let topPos = rect.top;
                let leftPos = rect.right + 20;

                // Jika elemen terlalu dekat di pinggir kanan
                if (leftPos + 320 > window.innerWidth) {
                    leftPos = Math.max(20, rect.left - 340); // Coba taruh di kiri
                    if (leftPos < 20) { // Masih ga muat, taruh di bawah
                        leftPos = Math.max(20, rect.left);
                        topPos = rect.bottom + 20;
                    }
                }
                // Jika elemen terlalu dekat di pinggir bawah layar
                if (topPos + 200 > window.innerHeight) {
                    topPos = Math.max(20, window.innerHeight - 250);
                }

                tooltip.style.top = topPos + 'px';
                tooltip.style.left = leftPos + 'px';
            }, 50);

        }, stepIndex === 1 ? 500 : 50); // Tambahan waktu jika ada perpindahan halaman
    }

    function nextTutorialStep() {
        tutorialStep++;
        showTutorialStep(tutorialStep);
    }

        const overlay = document.getElementById('tutorial-overlay');

            localStorage.setItem('tutorial_' + currentUser.email, 'true');

    function applyMaintenanceUI(res) {
        if (!res) return;
        isMaintenanceActive = res.active;

        const overlay = document.getElementById('maintenance-overlay');
        if (res.active) {
            if (currentUser && currentUser.role === 'Developer') {
                // Developer only gets a warning toast if they just logged in or if status changed
                if (!window._maintWarningShown) {
                    showToast('warning', 'Maintenance Active', 'Sistem sedang dalam mode maintenance global.');
                    window._maintWarningShown = true;
                }
            } else {
                if (overlay) {
                    overlay.style.display = 'flex';
                    document.getElementById('maint-msg').textContent = res.message;
                    // If regular user is trapped in maintenance, they can't do anything
                }
            }
        } else {
            // Hide overlay if active
            if (overlay) overlay.style.display = 'none';
            window._maintWarningShown = false;
        }

        // Always sync the dev menu button if it exists
        if (currentUser && currentUser.role === 'Developer') {
            updateDeveloperMenuUI();
        }
    }

        showToast('info', 'Sedang memproses...', 'Mengubah status maintenance...');

        google.script.run.withSuccessHandler(res => {
            if (res.success) {
